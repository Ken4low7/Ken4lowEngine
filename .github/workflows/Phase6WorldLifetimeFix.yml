name: Phase6WorldLifetimeFix

on:
  push:
    branches:
      - feature/phase6-advanced-systems
    paths:
      - .github/workflows/Phase6WorldLifetimeFix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase6-advanced-systems
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "Ken4low7"
          git config user.email "knt411sirokuro@gmail.com"
      - name: Apply World lifetime fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("Project/Engine/Scene/Actor/Core/ActorWorld.cpp")
          text = path.read_text(encoding="utf-8")
          include_anchor = '#include "SceneComponent.h"\n'
          include_line = '#include <Engine/Scene/Streaming/WorldPartitionManager.h>\n'
          if include_line not in text:
              if include_anchor not in text:
                  raise RuntimeError("ActorWorld include anchor not found")
              text = text.replace(include_anchor, include_anchor + include_line, 1)

          finalize_anchor = '\tvoid ActorWorld::Finalize()\n\t{\n'
          reset_code = (
              '\tvoid ActorWorld::Finalize()\n\t{\n'
              '\t\tWorldPartitionManager* partitionManager = WorldPartitionManager::GetInstance();\n'
              '\t\tif (partitionManager->IsConfiguredFor(this))\n'
              '\t\t{\n'
              '\t\t\tpartitionManager->Reset(); // World破棄後に旧SubLevel Requestを残さない。\n'
              '\t\t}\n\n'
          )
          if 'World破棄後に旧SubLevel Requestを残さない' not in text:
              if finalize_anchor not in text:
                  raise RuntimeError("ActorWorld Finalize anchor not found")
              text = text.replace(finalize_anchor, reset_code, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit and clean temporary workflow
        run: |
          git diff --check
          git add Project/Engine/Scene/Actor/Core/ActorWorld.cpp
          git commit -m "ActorWorld破棄時にStreaming状態を解除"
          git rm .github/workflows/Phase6WorldLifetimeFix.yml
          git commit -m "Phase 6の一時寿命補強Workflowを削除"
          git push origin HEAD:feature/phase6-advanced-systems
