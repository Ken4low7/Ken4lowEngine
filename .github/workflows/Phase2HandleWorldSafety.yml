name: Phase2HandleWorldSafety

on:
  push:
    branches:
      - feature/phase2-world-foundation
    paths:
      - .github/workflows/Phase2HandleWorldSafety.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase2-world-foundation
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "Ken4low7"
          git config user.email "knt411sirokuro@gmail.com"
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Harden ActorHandle world identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def rep(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = "Project/Engine/Scene/Actor/Core/WorldObjectId.h"
          text = read(path)
          text = rep(text,
              '\t/// <summary>ActorWorld内でComponentを識別する実行時ID。0は無効値。</summary>\n\tstruct ComponentId\n',
              '\t/// <summary>ActorWorldインスタンスを識別する実行時ID。0は無効値。</summary>\n\tstruct WorldId\n\t{\n\t\tuint64_t value = 0;\n\n\t\tconstexpr bool IsValid() const { return value != 0; }\n\t\tconstexpr explicit operator bool() const { return IsValid(); }\n\t\tconstexpr bool operator==(const WorldId&) const = default;\n\t};\n\n\t/// <summary>ActorWorld内でComponentを識別する実行時ID。0は無効値。</summary>\n\tstruct ComponentId\n',
              "WorldId")
          write(path, text)

          write("Project/Engine/Scene/Actor/Core/ActorHandle.h", '''#pragma once

#include "WorldObjectId.h"

namespace Ken4lowEngine
{
\t/// <summary>
\t/// Actorの生ポインタを長期間保持せず、WorldIdとActorIdからActorWorldへ解決するための軽量Handle。
\t/// World自体は所有せず、別Worldの同一ActorIdへ誤解決しない。
\t/// </summary>
\tclass ActorHandle
\t{
\tpublic:
\t\tconstexpr ActorHandle() = default;
\t\tconstexpr ActorHandle(WorldId worldId, ActorId actorId) : worldId_(worldId), actorId_(actorId) {}

\t\tconstexpr WorldId GetWorldId() const { return worldId_; }
\t\tconstexpr ActorId GetId() const { return actorId_; }
\t\tconstexpr bool IsSet() const { return worldId_.IsValid() && actorId_.IsValid(); }
\t\tconstexpr void Reset() { worldId_ = {}; actorId_ = {}; }
\t\tconstexpr explicit operator bool() const { return IsSet(); }
\t\tconstexpr bool operator==(const ActorHandle&) const = default;

\tprivate:
\t\tWorldId worldId_{};
\t\tActorId actorId_{};
\t};
} // namespace Ken4lowEngine
''')

          path = "Project/Engine/Scene/Actor/Core/ActorWorld.h"
          text = read(path)
          text = rep(text, '\t\tbool IsActorHandleValid(const ActorHandle& handle) const;\n', '\t\tbool IsActorHandleValid(const ActorHandle& handle) const;\n\t\tWorldId GetWorldId() const { return worldId_; }\n', "GetWorldId")
          text = rep(text, '\t\tstd::unordered_map<uint64_t, Actor*> actorsById_;\n', '\t\tWorldId worldId_{}; // ActorHandleが別Worldの同一ActorIdへ誤解決しないための実行時ID。\n\t\tstd::unordered_map<uint64_t, Actor*> actorsById_;\n', "WorldId member")
          text = rep(text, '\t\tActor* pendingReloadActor_ = nullptr;\n', '\t\tActorHandle pendingReloadActor_{};\n', "reload handle member")
          write(path, text)

          path = "Project/Engine/Scene/Actor/Core/ActorWorld.cpp"
          text = read(path)
          text = rep(text, '#include <algorithm>\n#include <cstdio>\n', '#include <algorithm>\n#include <atomic>\n#include <cstdio>\n', "atomic include")
          text = rep(text, 'namespace Ken4lowEngine\n{\n\tvoid ActorWorld::Initialize()\n', 'namespace Ken4lowEngine\n{\n\tnamespace\n\t{\n\t\tstd::atomic_uint64_t gNextActorWorldId{ 1 };\n\t}\n\n\tvoid ActorWorld::Initialize()\n', "WorldId allocator")
          text = rep(text,
              '''\tActorHandle ActorWorld::MakeActorHandle(const Actor* actor) const
\t{
\t\treturn actor && OwnsActor(actor) ? ActorHandle(actor->GetId()) : ActorHandle{};
\t}

\tActor* ActorWorld::ResolveActor(const ActorHandle& handle)
\t{
\t\tActor* actor = FindActorById(handle.GetId());
\t\treturn actor && !actor->IsPendingDestroy() ? actor : nullptr; // Destroy予約した時点で外部Handleからは無効として扱う。
\t}

\tconst Actor* ActorWorld::ResolveActor(const ActorHandle& handle) const
\t{
\t\tconst Actor* actor = FindActorById(handle.GetId());
\t\treturn actor && !actor->IsPendingDestroy() ? actor : nullptr; // World終端の実破棄待ちでも参照を再取得させない。
\t}
''',
              '''\tActorHandle ActorWorld::MakeActorHandle(const Actor* actor) const
\t{
\t\treturn actor && OwnsActor(actor) && worldId_.IsValid()
\t\t\t? ActorHandle(worldId_, actor->GetId())
\t\t\t: ActorHandle{};
\t}

\tActor* ActorWorld::ResolveActor(const ActorHandle& handle)
\t{
\t\tif (!handle.IsSet() || handle.GetWorldId() != worldId_) return nullptr;
\t\tActor* actor = FindActorById(handle.GetId());
\t\treturn actor && !actor->IsPendingDestroy() ? actor : nullptr; // Destroy予約した時点で外部Handleからは無効として扱う。
\t}

\tconst Actor* ActorWorld::ResolveActor(const ActorHandle& handle) const
\t{
\t\tif (!handle.IsSet() || handle.GetWorldId() != worldId_) return nullptr;
\t\tconst Actor* actor = FindActorById(handle.GetId());
\t\treturn actor && !actor->IsPendingDestroy() ? actor : nullptr; // World終端の実破棄待ちでも参照を再取得させない。
\t}
''', "ResolveActor")
          text = rep(text,
              '''\tvoid ActorWorld::ProcessPendingActorReload()
\t{
\t\tif (!hasPendingReloadActor_) return;
\t\tif (!pendingReloadActor_ || !OwnsActor(pendingReloadActor_))
\t\t{
\t\t\thasPendingReloadActor_ = false;
\t\t\tpendingReloadActor_ = nullptr;
\t\t\tpendingReloadFilePath_.clear();
\t\t\treturn; // 削除済みActorへの遅延参照は次フレームへ持ち越さない。
\t\t}

\t\tActor* reloadActor = pendingReloadActor_;
\t\tconst std::string reloadFilePath = pendingReloadFilePath_;

\t\thasPendingReloadActor_ = false; // 次フレームで再度処理されないようにフラグを下ろす
\t\tpendingReloadActor_ = nullptr; // 次フレームで再度処理されないようにポインタをクリアする
\t\tpendingReloadFilePath_.clear(); // 次フレームで再度処理されないようにファイルパスをクリアする
''',
              '''\tvoid ActorWorld::ProcessPendingActorReload()
\t{
\t\tif (!hasPendingReloadActor_) return;
\t\tActor* reloadActor = ResolveActor(pendingReloadActor_);
\t\tif (!reloadActor)
\t\t{
\t\t\thasPendingReloadActor_ = false;
\t\t\tpendingReloadActor_.Reset();
\t\t\tpendingReloadFilePath_.clear();
\t\t\treturn; // Destroy済み・別World・無効IDへの遅延参照は次フレームへ持ち越さない。
\t\t}

\t\tconst std::string reloadFilePath = pendingReloadFilePath_;

\t\thasPendingReloadActor_ = false; // 次フレームで再度処理されないようにフラグを下ろす
\t\tpendingReloadActor_.Reset(); // 次フレームで再度処理されないようにHandleをクリアする
\t\tpendingReloadFilePath_.clear(); // 次フレームで再度処理されないようにファイルパスをクリアする
''', "pending reload")
          text = rep(text, '\tvoid ActorWorld::PrepareActorForWorld(Actor& actor)\n\t{\n\t\tActorId actorId = actor.GetId();\n', '\tvoid ActorWorld::PrepareActorForWorld(Actor& actor)\n\t{\n\t\tif (!worldId_.IsValid())\n\t\t{\n\t\t\tworldId_ = WorldId{ gNextActorWorldId.fetch_add(1, std::memory_order_relaxed) };\n\t\t}\n\n\t\tActorId actorId = actor.GetId();\n', "PrepareActorForWorld")
          text = rep(text,
              '''\t\tif (pendingReloadActor_ == &actor)
\t\t{
\t\t\tpendingReloadActor_ = nullptr;
\t\t\thasPendingReloadActor_ = false;
\t\t\tpendingReloadFilePath_.clear();
\t\t}
''',
              '''\t\tif (pendingReloadActor_.GetWorldId() == worldId_ && pendingReloadActor_.GetId() == actor.GetId())
\t\t{
\t\t\tpendingReloadActor_.Reset();
\t\t\thasPendingReloadActor_ = false;
\t\t\tpendingReloadFilePath_.clear();
\t\t}
''', "ClearReferences")
          text = rep(text, '\t\tpendingReloadActor_ = nullptr;\n', '\t\tpendingReloadActor_.Reset();\n', "Finalize reload handle")
          write(path, text)

          path = "Project/Engine/Editor/Legacy/ActorWorld_ImGui.cpp"
          text = read(path)
          text = rep(text, '\t\t\t\tpendingReloadActor_ = saveTargetActor;\n', '\t\t\t\tpendingReloadActor_ = MakeActorHandle(saveTargetActor);\n', "Editor reload handle")
          write(path, text)

          path = "Project/Docs/Phase2WorldFoundation.md"
          text = read(path)
          text = rep(text,
              '`ActorHandle` はActorやActorWorldを所有せず、`ActorId` のみを保持します。  \n`ActorWorld::ResolveActor()` で必要な瞬間に解決し、Destroy予約済み・World外のActorは無効になります。  \nActorComponentから所有Actorへの短寿命な内部参照は従来どおりnon-owning raw pointerを維持します。\n',
              '`ActorHandle` はActorやActorWorldを所有せず、`WorldId + ActorId` の組だけを保持します。\n`ActorWorld::ResolveActor()` で必要な瞬間に解決し、Destroy予約済み・World外・別Worldの同一ActorIdは無効になります。\nActorWorld内部の遅延JSON再読込もraw `Actor*` ではなく`ActorHandle`で保持します。\nActorComponentから所有Actorへの短寿命な内部参照は従来どおりnon-owning raw pointerを維持します。\n', "docs")
          text = rep(text, '- Destroy後のActorHandleが解決されない\n', '- Destroy後のActorHandleが解決されない\n- 別ActorWorldの同一ActorIdへActorHandleが誤解決されない\n', "completion")
          write(path, text)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add Project/Engine/Scene/Actor/Core/WorldObjectId.h Project/Engine/Scene/Actor/Core/ActorHandle.h Project/Engine/Scene/Actor/Core/ActorWorld.h Project/Engine/Scene/Actor/Core/ActorWorld.cpp Project/Engine/Editor/Legacy/ActorWorld_ImGui.cpp Project/Docs/Phase2WorldFoundation.md
          git commit -m "ActorHandleをWorld単位で安全に解決"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Compile Debug C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:ClCompile /p:Platform=x64 /p:Configuration=Debug /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Compile Release C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:ClCompile /p:Platform=x64 /p:Configuration=Release /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Remove temporary workflow and push
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/Phase2HandleWorldSafety.yml
          git commit -m "Phase 2の一時ActorHandle検証Workflowを削除"
          git push origin HEAD:feature/phase2-world-foundation
