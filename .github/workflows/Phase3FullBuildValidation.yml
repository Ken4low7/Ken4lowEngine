name: Phase3FullBuildValidation

on:
  push:
    branches:
      - feature/phase3-asset-foundation
    paths:
      - .github/workflows/Phase3FullBuildValidation.yml

permissions:
  contents: write

jobs:
  full-build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-asset-foundation
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "Ken4low7"
          git config user.email "knt411sirokuro@gmail.com"
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Rebuild Debug
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:Rebuild /p:Platform=x64 /p:Configuration=Debug /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Rebuild Release
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:Rebuild /p:Platform=x64 /p:Configuration=Release /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Remove temporary workflow and push
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/Phase3FullBuildValidation.yml
          git commit -m "Phase 3の一時フルビルド検証Workflowを削除"
          git push origin HEAD:feature/phase3-asset-foundation
