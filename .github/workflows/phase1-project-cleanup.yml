name: Phase1Validation

on:
  push:
    branches:
      - feature/phase1-cleanup-profiling
    paths:
      - .github/workflows/phase1-project-cleanup.yml

jobs:
  validate:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Phase 1 audit
        shell: pwsh
        run: |
          ./Project/Tools/Scripts/AuditPhase1Cleanup.ps1 -OutputPath "Generated/Phase1Audit.md"
          Get-Content ./Project/Generated/Phase1Audit.md

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build Debug
        shell: pwsh
        run: |
          msbuild Project/Ken4lowEngine.sln /m /t:Rebuild /p:Platform=x64 /p:Configuration=Debug /verbosity:minimal "/clp:ErrorsOnly;Summary"
          if ($LASTEXITCODE -ne 0)
          {
              exit $LASTEXITCODE
          }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild Project/Ken4lowEngine.sln /m /t:Rebuild /p:Platform=x64 /p:Configuration=Release /verbosity:minimal "/clp:ErrorsOnly;Summary"
          if ($LASTEXITCODE -ne 0)
          {
              exit $LASTEXITCODE
          }

      - name: Upload Phase 1 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-audit
          path: Project/Generated/Phase1Audit.md
          retention-days: 1
