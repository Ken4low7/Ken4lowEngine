name: Phase28IntegrateDiagnostics

on:
  push:
    branches:
      - feature/phase28-debug-profiling-stress-test
    paths:
      - '.github/workflows/Phase28IntegrateDiagnostics.yml'
      - '.github/scripts/phase28_integrate_diagnostics.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase28-debug-profiling-stress-test
          fetch-depth: 0
      - name: Integrate Phase28 diagnostics
        run: python .github/scripts/phase28_integrate_diagnostics.py
      - name: Commit application integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project/Engine/Core/Application/GameApplication.cpp
          git commit -m "Phase28: integrate diagnostics capture and window"
          git push origin HEAD:feature/phase28-debug-profiling-stress-test
