name: Phase26 Implement

on:
  push:
    branches:
      - feature/phase26-fluid-light-posteffect-integration

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phase26 integration
        shell: python
        run: |
          from pathlib import Path

          def load(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def save(path: str, text: str) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              save(path, text.replace(old, new, 1))

          # -------------------- Graph data model --------------------
          path = "Project/Engine/Vfx/Graph/Data/VfxGraphTypes.h"
          replace_once(path,
              "enum class VfxCollisionResponse : uint32_t\n{\n\tBounce = 0,\n\tSlide,\n\tKill,\n};\n",
              "enum class VfxCollisionResponse : uint32_t\n{\n\tBounce = 0,\n\tSlide,\n\tKill,\n};\n\nenum class VfxGraphFluidDomain : uint32_t\n{\n\tFluid2D = 0,\n\tVolumetric3D,\n};\n")
          replace_once(path,
              "\tMeshRenderer,\n};\n",
              "\tMeshRenderer,\n\tFluidOutput,\n\tLightOutput,\n\tPostEffectOutput,\n};\n")
          replace_once(path,
              "using VfxGraphNodePayload = std::variant<\n",
              "struct VfxGraphFluidOutputNode\n{\n\tVfxGraphFluidDomain domain = VfxGraphFluidDomain::Volumetric3D;\n\tVector3 localOffset{};\n\tVector3 localVelocity{ 0.0f, 1.0f, 0.0f };\n\tfloat duration = 1.0f;\n\tfloat radius = 0.5f;\n\tfloat velocityStrength = 1.0f;\n\tfloat densityRate = 1.0f;\n\tfloat temperatureRate = 1.0f;\n\tfloat falloffExponent = 2.0f;\n\tstd::string intensityParameter;\n\tstd::string radiusParameter;\n};\n\nstruct VfxGraphLightOutputNode\n{\n\tVector3 localOffset{};\n\tVector3 color{ 1.0f, 0.8f, 0.4f };\n\tfloat duration = 0.15f;\n\tfloat intensity = 3.0f;\n\tfloat range = 5.0f;\n\tstd::string intensityParameter;\n\tstd::string radiusParameter;\n};\n\nstruct VfxGraphPostEffectOutputNode\n{\n\tstd::string effectName = \"Bloom\";\n\tfloat duration = 0.25f;\n\tfloat weight = 1.0f;\n\tstd::string intensityParameter;\n};\n\nusing VfxGraphNodePayload = std::variant<\n")
          replace_once(path,
              "\tVfxGraphTrailRendererNode,\n\tVfxGraphMeshRendererNode>;\n",
              "\tVfxGraphTrailRendererNode,\n\tVfxGraphMeshRendererNode,\n\tVfxGraphFluidOutputNode,\n\tVfxGraphLightOutputNode,\n\tVfxGraphPostEffectOutputNode>;\n")
          replace_once(path,
              "\tstatic constexpr uint32_t kMaxSubEmitterSpawnCount = 64u;\n",
              "\tstatic constexpr uint32_t kMaxSubEmitterSpawnCount = 64u;\n\tstatic constexpr uint32_t kMaxIntegrationTracks = 64u;\n")
          replace_once(path,
              "const char* ToString(VfxCollisionResponse response);\n",
              "const char* ToString(VfxCollisionResponse response);\nconst char* ToString(VfxGraphFluidDomain domain);\n")
          replace_once(path,
              "bool TryParseVfxCollisionResponse(const std::string& text, VfxCollisionResponse& outResponse);\n",
              "bool TryParseVfxCollisionResponse(const std::string& text, VfxCollisionResponse& outResponse);\nbool TryParseVfxGraphFluidDomain(const std::string& text, VfxGraphFluidDomain& outDomain);\n")

          path = "Project/Engine/Vfx/Graph/Data/VfxGraphTypes.cpp"
          replace_once(path,
              "\tcase VfxGraphNodeType::SubEmitter:\n\t\treturn VfxGraphNodeStage::Update;\n",
              "\tcase VfxGraphNodeType::SubEmitter:\n\tcase VfxGraphNodeType::FluidOutput:\n\t\treturn VfxGraphNodeStage::Update;\n")
          replace_once(path,
              "\tcase VfxGraphNodeType::MeshRenderer:\n\t\treturn VfxGraphNodeStage::Render;\n",
              "\tcase VfxGraphNodeType::MeshRenderer:\n\tcase VfxGraphNodeType::LightOutput:\n\tcase VfxGraphNodeType::PostEffectOutput:\n\t\treturn VfxGraphNodeStage::Render;\n")
          replace_once(path,
              "\tcase VfxGraphNodeType::MeshRenderer: return \"MeshRenderer\";\n\tdefault: return \"SpawnRate\";\n",
              "\tcase VfxGraphNodeType::MeshRenderer: return \"MeshRenderer\";\n\tcase VfxGraphNodeType::FluidOutput: return \"FluidOutput\";\n\tcase VfxGraphNodeType::LightOutput: return \"LightOutput\";\n\tcase VfxGraphNodeType::PostEffectOutput: return \"PostEffectOutput\";\n\tdefault: return \"SpawnRate\";\n")
          replace_once(path,
              "const char* ToString(VfxCollisionResponse response)\n{\n\tswitch (response)\n\t{\n\tcase VfxCollisionResponse::Bounce: return \"Bounce\";\n\tcase VfxCollisionResponse::Slide: return \"Slide\";\n\tcase VfxCollisionResponse::Kill: return \"Kill\";\n\tdefault: return \"Bounce\";\n\t}\n}\n",
              "const char* ToString(VfxCollisionResponse response)\n{\n\tswitch (response)\n\t{\n\tcase VfxCollisionResponse::Bounce: return \"Bounce\";\n\tcase VfxCollisionResponse::Slide: return \"Slide\";\n\tcase VfxCollisionResponse::Kill: return \"Kill\";\n\tdefault: return \"Bounce\";\n\t}\n}\n\nconst char* ToString(VfxGraphFluidDomain domain)\n{\n\tswitch (domain)\n\t{\n\tcase VfxGraphFluidDomain::Fluid2D: return \"Fluid2D\";\n\tcase VfxGraphFluidDomain::Volumetric3D: return \"Volumetric3D\";\n\tdefault: return \"Volumetric3D\";\n\t}\n}\n")
          replace_once(path,
              "\telse if (text == \"MeshRenderer\") outType = VfxGraphNodeType::MeshRenderer;\n\telse return false;\n",
              "\telse if (text == \"MeshRenderer\") outType = VfxGraphNodeType::MeshRenderer;\n\telse if (text == \"FluidOutput\") outType = VfxGraphNodeType::FluidOutput;\n\telse if (text == \"LightOutput\") outType = VfxGraphNodeType::LightOutput;\n\telse if (text == \"PostEffectOutput\") outType = VfxGraphNodeType::PostEffectOutput;\n\telse return false;\n")
          replace_once(path,
              "bool TryParseVfxCollisionResponse(const std::string& text, VfxCollisionResponse& outResponse)\n{\n\tif (text == \"Bounce\") outResponse = VfxCollisionResponse::Bounce;\n\telse if (text == \"Slide\") outResponse = VfxCollisionResponse::Slide;\n\telse if (text == \"Kill\") outResponse = VfxCollisionResponse::Kill;\n\telse return false;\n\treturn true;\n}\n\n} // namespace Ken4lowEngine\n",
              "bool TryParseVfxCollisionResponse(const std::string& text, VfxCollisionResponse& outResponse)\n{\n\tif (text == \"Bounce\") outResponse = VfxCollisionResponse::Bounce;\n\telse if (text == \"Slide\") outResponse = VfxCollisionResponse::Slide;\n\telse if (text == \"Kill\") outResponse = VfxCollisionResponse::Kill;\n\telse return false;\n\treturn true;\n}\n\nbool TryParseVfxGraphFluidDomain(const std::string& text, VfxGraphFluidDomain& outDomain)\n{\n\tif (text == \"Fluid2D\") outDomain = VfxGraphFluidDomain::Fluid2D;\n\telse if (text == \"Volumetric3D\") outDomain = VfxGraphFluidDomain::Volumetric3D;\n\telse return false;\n\treturn true;\n}\n\n} // namespace Ken4lowEngine\n")

          # -------------------- Integration compiler --------------------
          save("Project/Engine/Vfx/Graph/Runtime/VfxGraphIntegrationCompiler.h", r'''#pragma once

#include "Engine/Vfx/Graph/Data/VfxGraphTypes.h"
#include "Engine/Vfx/Data/VfxCueTypes.h"

#include <string>
