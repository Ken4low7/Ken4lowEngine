name: Phase26 Implement

on:
  push:
    branches:
      - feature/phase26-fluid-light-posteffect-integration

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Recover staged patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          previous = subprocess.check_output(
              ["git", "show", "9c49a7be136670b4b788e34ed3c6e9cc4908a4a2:.github/workflows/Phase26Implement.yml"],
              text=True,
          )
          marker = "        run: |\n"
          start = previous.index(marker) + len(marker)
          end = previous.index("\n      - name: Commit Phase26 implementation", start)
          block = previous[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/apply_phase26.py").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Apply Phase26 integration
        run: python /tmp/apply_phase26.py

      - name: Commit Phase26 project implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project
          git commit -m "Phase26: integrate fluid light and post effects"
          git push
