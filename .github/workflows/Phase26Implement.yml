class VfxGraphIntegrationCompiler final
{
public:
	static bool Compile(
		const VfxGraphDesc& graph,
		VfxCueDesc& outOneShotCue,
		VfxCueDesc& outLoopCue,
		std::vector<std::string>& errors);
};

