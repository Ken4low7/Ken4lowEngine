name: Phase4LevelSceneIntegration

on:
  push:
    branches:
      - feature/phase4-level-scene
    paths:
      - .github/workflows/Phase4LevelSceneIntegration.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase4-level-scene
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "Ken4low7"
          git config user.email "knt411sirokuro@gmail.com"
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Integrate Phase 4 Level Scene foundation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # ActorWorldへStaging済みActorを一括Commitする入口とPrefab参照寿命管理を追加する。
          path = 'Project/Engine/Scene/Actor/Core/ActorWorld.h'
          text = read(path)
          text = replace_once(
              text,
              '\t\tvoid Finalize();\n',
              '\t\tvoid Finalize();\n\n'
              '\t\t/// <summary>全ActorのStaging成功後だけ現在Worldを置換するTransactional Loader専用入口。</summary>\n'
              '\t\tbool CommitStagedActors(\n'
              '\t\t\tstd::vector<std::unique_ptr<Actor>> stagedActors,\n'
              '\t\t\tstd::vector<Actor*>* outActors = nullptr);\n',
              'ActorWorld Commit declaration')
          write(path, text)

          path = 'Project/Engine/Scene/Actor/Core/ActorWorld.cpp'
          text = read(path)
          text = replace_once(
              text,
              '#include "ActorJsonSerializer.h"\n',
              '#include "ActorJsonSerializer.h"\n#include "PrefabInstanceRegistry.h"\n',
              'Prefab registry include')
          text = replace_once(
              text,
              '\t\t\tcameraComponent->SetAutoRegisterMainCamera(false); // SpawnしたActorのCameraComponentをMainCameraとして登録する\n',
              '\t\t\tif (options.disableAutoRegisterMainCamera)\n'
              '\t\t\t{\n'
              '\t\t\t\tcameraComponent->SetAutoRegisterMainCamera(false); // Prefab配置時は既存MainCameraを維持する。\n'
              '\t\t\t}\n',
              'Camera spawn option')
          text = replace_once(
              text,
              '\t\tAddActorToWorld(std::move(actor), false); // JSON生成済みComponentはSerializer側で初期化されている。\n\n'
              '\t\tselectedActor_ = spawnedActor;',
              '\t\tAddActorToWorld(std::move(actor), false); // JSON生成済みComponentはSerializer側で初期化されている。\n'
              '\t\tif (options.trackPrefabReference)\n'
              '\t\t{\n'
              '\t\t\tPrefabInstanceRegistry::GetInstance()->Register(spawnedActor, filePath);\n'
              '\t\t}\n\n'
              '\t\tselectedActor_ = spawnedActor;',
              'Prefab source registration')
          text = replace_once(
              text,
              '\tActor* ActorWorld::FindActorById(ActorId id)\n',
              '\tbool ActorWorld::CommitStagedActors(\n'
              '\t\tstd::vector<std::unique_ptr<Actor>> stagedActors,\n'
              '\t\tstd::vector<Actor*>* outActors)\n'
              '\t{\n'
              '\t\tif (isUpdating_) return false;\n'
              '\t\tfor (const std::unique_ptr<Actor>& actor : stagedActors)\n'
              '\t\t{\n'
              '\t\t\tif (!actor) return false; // Destructive pointへ入る前に全Staging所有権を検証する。\n'
              '\t\t}\n\n'
              '\t\tif (outActors) outActors->clear();\n'
              '\t\tSetSelectedEditorObject(nullptr, nullptr);\n'
              '\t\tFinalize();\n'
              '\t\tInitialize(); // ここから先は検証済みActorの所有権移動だけなので失敗経路を持たせない。\n\n'
              '\t\tif (outActors) outActors->reserve(stagedActors.size());\n'
              '\t\tfor (std::unique_ptr<Actor>& actor : stagedActors)\n'
              '\t\t{\n'
              '\t\t\tActor* committedActor = AddActorToWorld(std::move(actor), false);\n'
              '\t\t\tif (outActors) outActors->push_back(committedActor);\n'
              '\t\t}\n'
              '\t\treturn true;\n'
              '\t}\n\n'
              '\tActor* ActorWorld::FindActorById(ActorId id)\n',
              'ActorWorld Commit implementation')
          text = replace_once(
              text,
              '\tvoid ActorWorld::ReleaseActorFromWorld(Actor& actor)\n\t{\n',
              '\tvoid ActorWorld::ReleaseActorFromWorld(Actor& actor)\n\t{\n'
              '\t\tPrefabInstanceRegistry::GetInstance()->Remove(&actor); // World寿命を越えてPrefab元ポインタを保持しない。\n',
              'Prefab registry release')
          write(path, text)

          # PrefabブラウザとContent Browser配置はLevel保存時にPrefab参照として追跡する。
          path = 'Project/Engine/Editor/Legacy/ActorWorld_Prefab.cpp'
          text = read(path)
          text = replace_once(
              text,
              '\t\t\t\toptions.disableAutoRegisterMainCamera = true;\n'
              '\t\t\t\tpendingSpawnFilePath_ = actorPrefabPath_;',
              '\t\t\t\toptions.disableAutoRegisterMainCamera = true;\n'
              '\t\t\t\toptions.trackPrefabReference = true;\n'
              '\t\t\t\tpendingSpawnFilePath_ = actorPrefabPath_;',
              'Prefab browser tracking')
          write(path, text)

          path = 'Project/Engine/Editor/EditorAssetPlacementService.h'
          text = read(path)
          text = replace_once(
              text,
              '\t\t\t\toptions.disableAutoRegisterMainCamera = true;\n'
              '\t\t\t\tconst std::string prefabPath =',
              '\t\t\t\toptions.disableAutoRegisterMainCamera = true;\n'
              '\t\t\t\toptions.trackPrefabReference = true;\n'
              '\t\t\t\tconst std::string prefabPath =',
              'Content Browser prefab tracking')
          write(path, text)

          # 旧巨大LoaderはPhase 4のTransactional Loaderへ互換転送する。
          path = 'Project/Engine/Scene/Level/SceneLevelLoader.h'
          write(path, '''#pragma once\n\n#include "TransactionalLevelLoader.h"\n\nnamespace Ken4lowEngine\n{\n\t/// <summary>既存BaseScene APIを維持しながらPhase 4 Transactional Loaderへ転送する互換Facade。</summary>\n\tclass SceneLevelLoader\n\t{\n\tpublic:\n\t\tusing Result = TransactionalLevelLoader::Result;\n\n\t\tstatic Result Load(const std::filesystem::path& levelPath, ActorWorld& actorWorld)\n\t\t{\n\t\t\treturn TransactionalLevelLoader::Load(levelPath, actorWorld);\n\t\t}\n\t};\n} // namespace Ken4lowEngine\n''')

          # EditorのSave/Openも共通Document/Serializer/Transactional Loaderへ統合する。
          path = 'Project/Engine/Editor/EditorLevelService.h'
          text = read(path)
          text = replace_once(
              text,
              '#include <LightManager.h>\n',
              '#include <LightManager.h>\n#include <LevelDocument.h>\n#include <LevelSerializer.h>\n#include <TransactionalLevelLoader.h>\n',
              'Editor Level includes')
          text = replace_once(
              text,
              '\t\tstatic constexpr int kCurrentFormatVersion = 1;\n',
              '\t\tstatic constexpr int kCurrentFormatVersion = static_cast<int>(LevelDocument::kCurrentVersion);\n',
              'Editor Level version')

          serialize_start = text.index('\t\tnlohmann::json SerializeLevel(ActorWorld& actorWorld) const')
          save_start = text.index('\n\t\tbool SaveLevelToPath(', serialize_start)
          serialize_replacement = '''\t\tnlohmann::json SerializeLevel(ActorWorld& actorWorld) const\n\t\t{\n\t\t\tBaseScene* scene = GetCurrentScene();\n\t\t\tLevelDocument document = LevelSerializer::CaptureWorld(\n\t\t\t\tactorWorld,\n\t\t\t\tcurrentLevelPath_.empty() ? "Untitled" : currentLevelPath_.stem().string(),\n\t\t\t\tscene ? ResolveSceneName(*scene) : "UnknownScene",\n\t\t\t\tSerializeLighting(),\n\t\t\t\tSerializeCamera(),\n\t\t\t\tnlohmann::json::object());\n\t\t\treturn LevelSerializer::Serialize(document);\n\t\t}\n'''
          text = text[:serialize_start] + serialize_replacement + text[save_start:]

          save_start = text.index('\t\tbool SaveLevelToPath(')
          restore_start = text.index('\n\t\tstatic void RestoreCameraRegistration', save_start)
          save_replacement = '''\t\tbool SaveLevelToPath(\n\t\t\tconst std::filesystem::path& requestedPath,\n\t\t\tbool updateCurrentPath,\n\t\t\tbool createBackup,\n\t\t\tbool clearDirty,\n\t\t\tstd::string_view operationName)\n\t\t{\n\t\t\tActorWorld* actorWorld = GetCurrentActorWorld();\n\t\t\tif (!actorWorld)\n\t\t\t{\n\t\t\t\tSetStatus(false, "現在のSceneはEditor用ActorWorldを公開していません。");\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tconst std::filesystem::path path = NormalizeLevelPath(requestedPath);\n\t\t\tif (path.empty())\n\t\t\t{\n\t\t\t\tSetStatus(false, "Level保存パスが空です。");\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\ttry\n\t\t\t{\n\t\t\t\tif (createBackup && std::filesystem::exists(path)) CreateBackup(path);\n\t\t\t\tBaseScene* scene = GetCurrentScene();\n\t\t\t\tLevelDocument document = LevelSerializer::CaptureWorld(\n\t\t\t\t\t*actorWorld,\n\t\t\t\t\tpath.stem().string(),\n\t\t\t\t\tscene ? ResolveSceneName(*scene) : "UnknownScene",\n\t\t\t\t\tSerializeLighting(),\n\t\t\t\t\tSerializeCamera(),\n\t\t\t\t\tnlohmann::json::object());\n\n\t\t\t\tconst LevelSerializer::Result saveResult = LevelSerializer::SaveToFileAtomic(path, document);\n\t\t\t\tif (!saveResult.succeeded)\n\t\t\t\t{\n\t\t\t\t\tSetStatus(false, std::string(operationName) + " failed: " + saveResult.message);\n\t\t\t\t\treturn false;\n\t\t\t\t}\n\n\t\t\t\tif (updateCurrentPath)\n\t\t\t\t{\n\t\t\t\t\tcurrentLevelPath_ = path;\n\t\t\t\t\tEditorContext::GetInstance()->SetActiveLevelName(path.filename().string());\n\t\t\t\t\tAddRecentLevel(path);\n\t\t\t\t}\n\t\t\t\tif (clearDirty) EditorContext::GetInstance()->MarkLevelDirty(false);\n\t\t\t\tSetStatus(true, std::string(operationName) + ": " + path.generic_string());\n\t\t\t\treturn true;\n\t\t\t}\n\t\t\tcatch (const std::exception& exception)\n\t\t\t{\n\t\t\t\tSetStatus(false, std::string(operationName) + " failed: " + exception.what());\n\t\t\t\treturn false;\n\t\t\t}\n\t\t}\n'''
          text = text[:save_start] + save_replacement + text[restore_start:]

          load_start = text.index('\t\tbool LoadLevelFromPath(')
          timestamp_start = text.index('\n\t\tstatic std::string MakeTimestamp()', load_start)
          load_replacement = '''\t\tbool LoadLevelFromPath(const std::filesystem::path& requestedPath)\n\t\t{\n\t\t\tActorWorld* actorWorld = GetCurrentActorWorld();\n\t\t\tif (!actorWorld)\n\t\t\t{\n\t\t\t\tSetStatus(false, "現在のSceneはEditor用ActorWorldを公開していません。");\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tconst std::filesystem::path path = NormalizeLevelPath(requestedPath);\n\t\t\tLevelDocument document{};\n\t\t\tconst LevelSerializer::Result parseResult = LevelSerializer::LoadFromFile(path, document);\n\t\t\tif (!parseResult.succeeded)\n\t\t\t{\n\t\t\t\tSetStatus(false, "Open failed: " + parseResult.message);\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tconst TransactionalLevelLoader::Result loadResult = TransactionalLevelLoader::LoadDocument(document, *actorWorld);\n\t\t\tif (!loadResult.succeeded)\n\t\t\t{\n\t\t\t\tSetStatus(false, "Open failed: " + loadResult.message);\n\t\t\t\treturn false; // Commit前失敗では現在のActorWorldとEditor状態を維持する。\n\t\t\t}\n\n\t\t\tEditorCommandHistory::GetInstance()->Clear();\n\t\t\tEditorContext::GetInstance()->GetSelection().Clear();\n\t\t\tEditorContext::GetInstance()->ClearPlacementRequest();\n\t\t\tactorWorld->SetSelectedEditorObject(nullptr, nullptr);\n\t\t\tcurrentLevelPath_ = path;\n\t\t\tEditorContext::GetInstance()->SetActiveLevelName(path.filename().string());\n\t\t\tEditorContext::GetInstance()->MarkLevelDirty(false);\n\t\t\tautoSaveElapsed_ = 0.0f;\n\t\t\tAddRecentLevel(path);\n\n\t\t\tstd::string message = "Opened: " + path.generic_string();\n\t\t\tif (parseResult.migrated)\n\t\t\t{\n\t\t\t\tmessage += " (Version " + std::to_string(parseResult.sourceVersion) + " -> " +\n\t\t\t\t\tstd::to_string(LevelDocument::kCurrentVersion) + ")";\n\t\t\t}\n\t\t\tSetStatus(true, std::move(message));\n\t\t\treturn true;\n\t\t}\n'''
          text = text[:load_start] + load_replacement + text[timestamp_start:]
          write(path, text)

          # Transactional Loader実装の不要な一時vectorを除去する。
          path = 'Project/Engine/Scene/Level/TransactionalLevelLoader.cpp'
          text = read(path)
          text = text.replace('\t\tstd::vector<Actor*> stagedActorPointers;\n', '')
          text = text.replace('\t\tstagedActorPointers.reserve(document.actors.size());\n', '')
          text = text.replace('\t\t\tstagedActorPointers.push_back(actorPointer);\n', '')
          write(path, text)

          # Visual StudioプロジェクトへPhase 4の新規翻訳単位を登録する。
          path = 'Project/Ken4lowEngine.vcxproj'
          text = read(path)
          project_items = '''  <ItemGroup>\n    <ClCompile Include="Engine\\Scene\\Actor\\Serialization\\PrefabInstanceRegistry.cpp" />\n    <ClCompile Include="Engine\\Scene\\Level\\LevelSerializer.cpp" />\n    <ClCompile Include="Engine\\Scene\\Level\\LevelVersionMigration.cpp" />\n    <ClCompile Include="Engine\\Scene\\Level\\PrefabReferenceResolver.cpp" />\n    <ClCompile Include="Engine\\Scene\\Level\\TransactionalLevelLoader.cpp" />\n    <ClCompile Include="Engine\\Scene\\Management\\SceneDefinitionSerializer.cpp" />\n    <ClInclude Include="Engine\\Scene\\Actor\\Serialization\\PrefabInstanceRegistry.h" />\n    <ClInclude Include="Engine\\Scene\\Level\\LevelDocument.h" />\n    <ClInclude Include="Engine\\Scene\\Level\\LevelSerializer.h" />\n    <ClInclude Include="Engine\\Scene\\Level\\LevelVersionMigration.h" />\n    <ClInclude Include="Engine\\Scene\\Level\\PrefabReferenceResolver.h" />\n    <ClInclude Include="Engine\\Scene\\Level\\TransactionalLevelLoader.h" />\n    <ClInclude Include="Engine\\Scene\\Management\\SceneDefinitionSerializer.h" />\n  </ItemGroup>\n'''
          if 'Engine\\Scene\\Level\\TransactionalLevelLoader.cpp' not in text:
              text = replace_once(text, '</Project>', project_items + '</Project>', 'vcxproj Phase4 ItemGroup')
          write(path, text)

          path = 'Project/Ken4lowEngine.vcxproj.filters'
          text = read(path)
          filter_items = '''  <ItemGroup>\n    <ClCompile Include="Engine\\Scene\\Actor\\Serialization\\PrefabInstanceRegistry.cpp"><Filter>Engine\\Scene\\Actor\\Serialization</Filter></ClCompile>\n    <ClCompile Include="Engine\\Scene\\Level\\LevelSerializer.cpp"><Filter>Engine\\Scene\\Level</Filter></ClCompile>\n    <ClCompile Include="Engine\\Scene\\Level\\LevelVersionMigration.cpp"><Filter>Engine\\Scene\\Level</Filter></ClCompile>\n    <ClCompile Include="Engine\\Scene\\Level\\PrefabReferenceResolver.cpp"><Filter>Engine\\Scene\\Level</Filter></ClCompile>\n    <ClCompile Include="Engine\\Scene\\Level\\TransactionalLevelLoader.cpp"><Filter>Engine\\Scene\\Level</Filter></ClCompile>\n    <ClCompile Include="Engine\\Scene\\Management\\SceneDefinitionSerializer.cpp"><Filter>Engine\\Scene\\Management</Filter></ClCompile>\n    <ClInclude Include="Engine\\Scene\\Actor\\Serialization\\PrefabInstanceRegistry.h"><Filter>Engine\\Scene\\Actor\\Serialization</Filter></ClInclude>\n    <ClInclude Include="Engine\\Scene\\Level\\LevelDocument.h"><Filter>Engine\\Scene\\Level</Filter></ClInclude>\n    <ClInclude Include="Engine\\Scene\\Level\\LevelSerializer.h"><Filter>Engine\\Scene\\Level</Filter></ClInclude>\n    <ClInclude Include="Engine\\Scene\\Level\\LevelVersionMigration.h"><Filter>Engine\\Scene\\Level</Filter></ClInclude>\n    <ClInclude Include="Engine\\Scene\\Level\\PrefabReferenceResolver.h"><Filter>Engine\\Scene\\Level</Filter></ClInclude>\n    <ClInclude Include="Engine\\Scene\\Level\\TransactionalLevelLoader.h"><Filter>Engine\\Scene\\Level</Filter></ClInclude>\n    <ClInclude Include="Engine\\Scene\\Management\\SceneDefinitionSerializer.h"><Filter>Engine\\Scene\\Management</Filter></ClInclude>\n  </ItemGroup>\n'''
          if 'Engine\\Scene\\Level\\TransactionalLevelLoader.cpp' not in text:
              text = replace_once(text, '</Project>', filter_items + '</Project>', 'filters Phase4 ItemGroup')
          write(path, text)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add Project
          git commit -m "Level読込をTransactional Loaderへ統合"
          git push origin HEAD:feature/phase4-level-scene

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Compile Debug C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:ClCompile /p:Platform=x64 /p:Configuration=Debug /p:WarningLevel=Level4 /p:TreatWarningAsError=true /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Compile Release C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:ClCompile /p:Platform=x64 /p:Configuration=Release /p:WarningLevel=Level4 /p:TreatWarningAsError=true /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Remove temporary workflow and push
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/Phase4LevelSceneIntegration.yml
          git commit -m "Phase 4の一時Level Scene検証Workflowを削除"
          git push origin HEAD:feature/phase4-level-scene
