name: Phase25 Apply Editor Integration Patch

on:
  push:
    branches:
      - feature/phase25-vfx-graph-editor-preview

permissions:
  contents: write

jobs:
  patch-editor-integration:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch editor integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return False
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}: {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              return True

          changed = False
          app = Path("Project/Engine/Core/Application/GameApplication.cpp")
          changed |= replace_once(
              app,
              '#include "Engine/Vfx/Editor/VfxTimelineEditor.h"\n',
              '#include "Engine/Vfx/Editor/VfxTimelineEditor.h"\n#include "Engine/Vfx/Graph/Editor/VfxGraphEditor.h"\n')
          changed |= replace_once(
              app,
              '\t\tVfxTimelineEditor::GetInstance()->Initialize();\n',
              '\t\tVfxTimelineEditor::GetInstance()->Initialize();\n\t\tVfxGraphEditor::GetInstance()->Initialize(); // Phase25 Graph authoring/preview shares the existing GPU particle runtime.\n')
          changed |= replace_once(
              app,
              '\t\t\t\t\tVfxTimelineEditor::GetInstance()->Draw(&editorWindowState.showVfxTimeline);\n',
              '\t\t\t\t\tVfxTimelineEditor::GetInstance()->Draw(&editorWindowState.showVfxTimeline);\n\t\t\t\t\tVfxGraphEditor::GetInstance()->Draw(&editorWindowState.showVfxGraphEditor);\n')

          app_text = app.read_text(encoding="utf-8")
          if 'VfxGraphEditor::GetInstance()->Finalize();' not in app_text:
              marker = '\t\tVfxTimelineEditor::GetInstance()->Finalize();\n'
              if marker in app_text:
                  app.write_text(app_text.replace(marker, marker + '\t\tVfxGraphEditor::GetInstance()->Finalize();\n', 1), encoding="utf-8")
                  changed = True

          state = Path("Project/Engine/Editor/EditorWindowManager.h")
          changed |= replace_once(
              state,
              '\t\tbool showVfxTimeline = true; // Phase18はTimeline/Preview/Diagnosticsを独立Dock Windowとして既定表示する。\n',
              '\t\tbool showVfxTimeline = true; // Phase18はTimeline/Preview/Diagnosticsを独立Dock Windowとして既定表示する。\n\t\tbool showVfxGraphEditor = true; // Phase25 Graph authoringとlive previewを独立Dock Windowとして表示する。\n')

          manager = Path("Project/Engine/Editor/EditorWindowManager.cpp")
          changed |= replace_once(
              manager,
              '\t\t\t\tImGui::MenuItem("Json Asset Manager", nullptr, &windowState_.showJsonAssetManager);\n',
              '\t\t\t\tImGui::MenuItem("Json Asset Manager", nullptr, &windowState_.showJsonAssetManager);\n\t\t\t\tImGui::MenuItem("VFX Timeline", nullptr, &windowState_.showVfxTimeline);\n\t\t\t\tImGui::MenuItem("VFX Graph Editor", nullptr, &windowState_.showVfxGraphEditor);\n')

          if not changed:
              print("Phase25 editor integration already applied.")

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project/Engine/Core/Application/GameApplication.cpp Project/Engine/Editor/EditorWindowManager.h Project/Engine/Editor/EditorWindowManager.cpp
          git commit -m "Phase25: integrate VFX Graph Editor into application UI"
          git push
