name: Phase25 Apply MinMax Patch

on:
  push:
    branches:
      - feature/phase25-vfx-graph-editor-preview

permissions:
  contents: write

jobs:
  patch-minmax:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Windows min/max macro collisions
        shell: python
        run: |
          from pathlib import Path

          path = Path("Project/Engine/Vfx/Graph/Editor/VfxGraphEditor.cpp")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "std::max(result, node.id + 1u)": "(std::max)(result, node.id + 1u)",
              "std::max(maxParticles, 1)": "(std::max)(maxParticles, 1)",
              "std::max(45.0f, std::abs(to.x - from.x) * 0.4f)": "(std::max)(45.0f, std::abs(to.x - from.x) * 0.4f)",
              "std::max(value, 0)": "(std::max)(value, 0)",
          }

          for old, new in replacements.items():
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project/Engine/Vfx/Graph/Editor/VfxGraphEditor.cpp
          git commit -m "Phase25: avoid Windows min max macro collisions"
          git push
