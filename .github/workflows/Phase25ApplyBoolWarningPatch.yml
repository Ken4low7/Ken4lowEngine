name: Phase25 Apply Bool Warning Patch

on:
  push:
    branches:
      - feature/phase25-vfx-graph-editor-preview

permissions:
  contents: write

jobs:
  patch-bool-warning:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace bool bitwise accumulation with logical accumulation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("Project/Engine/Vfx/Graph/Editor/VfxGraphEditor.cpp")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"^(\s*)changed \|= (.+);$", re.MULTILINE)
          matches = pattern.findall(text)
          if len(matches) != 22:
              raise RuntimeError(f"Expected 22 bool accumulation sites, found {len(matches)}")

          def replace(match):
              indent, expression = match.groups()
              # Evaluate the ImGui/editor expression first so a previous change never short-circuits the UI call.
              return f"{indent}changed = {expression} || changed;"

          text = pattern.sub(replace, text)
          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project/Engine/Vfx/Graph/Editor/VfxGraphEditor.cpp
          git commit -m "Phase25: avoid bool bitwise warning in Debug editor build"
          git push
