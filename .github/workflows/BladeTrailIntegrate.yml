name: BladeTrailIntegrate

on:
  push:
    branches:
      - feature/blade-trail-npoint-ribbon

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate BladeTrail build and component factory
        shell: python
        run: |
          from pathlib import Path

          factory_path = Path('Project/Engine/Scene/Actor/Serialization/ComponentFactory.cpp')
          factory = factory_path.read_text(encoding='utf-8')
          if '#include "BladeTrailComponent.h"' not in factory:
              factory = factory.replace(
                  '#include "BillboardComponent.h"\n',
                  '#include "BillboardComponent.h"\n#include "BladeTrailComponent.h"\n',
                  1)

          registration = '\t\t\tMakeComponentTypeInfo<BladeTrailComponent>("BladeTrailComponent", true, "ブレードトレイル", "演出", "剣のRoot/Tip履歴から滑らかなN-point Ribbon斬撃軌跡を描画します。"),\n\n'
          registration_anchor = '\t\t\tMakeComponentTypeInfo<GpuParticleComponent>("GpuParticleComponent"'
          if 'MakeComponentTypeInfo<BladeTrailComponent>' not in factory:
              index = factory.index(registration_anchor)
              factory = factory[:index] + registration + factory[index:]
          factory_path.write_text(factory, encoding='utf-8')

          props_path = Path('Project/Directory.Build.props')
          props = props_path.read_text(encoding='utf-8')
          if 'BladeTrailRenderer.cpp' not in props:
              items = '''    <!-- N-point Blade Trailは既存FrameUploadArenaとRuntime描画基盤へ追加登録する。 -->
    <ClCompile Include="$(MSBuildThisFileDirectory)Engine\\Graphics\\Renderer\\BladeTrail\\BladeTrailRenderer.cpp" />
    <ClCompile Include="$(MSBuildThisFileDirectory)Engine\\Scene\\Actor\\Components\\BladeTrailComponent.cpp" />
    <ClInclude Include="$(MSBuildThisFileDirectory)Engine\\Graphics\\Renderer\\BladeTrail\\BladeTrailRenderer.h" />
    <ClInclude Include="$(MSBuildThisFileDirectory)Engine\\Scene\\Actor\\Components\\BladeTrailComponent.h" />
    <ClInclude Include="$(MSBuildThisFileDirectory)Engine\\Graphics\\Shader\\Manifest\\BladeTrailShaderManifest.h" />
    <None Include="$(MSBuildThisFileDirectory)Resources\\Shaders\\BladeTrail\\BladeTrail.VS.hlsl" />
    <None Include="$(MSBuildThisFileDirectory)Resources\\Shaders\\BladeTrail\\BladeTrail.PS.hlsl" />
'''
              props = props.replace('  </ItemGroup>\n</Project>', items + '  </ItemGroup>\n</Project>', 1)
          props_path.write_text(props, encoding='utf-8')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project/Engine/Scene/Actor/Serialization/ComponentFactory.cpp Project/Directory.Build.props
          if ! git diff --cached --quiet; then
            git commit -m "BladeTrail: register component and build inputs"
            git push
          fi
