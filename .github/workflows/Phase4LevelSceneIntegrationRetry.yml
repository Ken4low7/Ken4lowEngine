name: Phase4LevelSceneIntegrationRetry

on:
  push:
    branches:
      - feature/phase4-level-scene
    paths:
      - .github/workflows/Phase4LevelSceneIntegrationRetry.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase4-level-scene
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "Ken4low7"
          git config user.email "knt411sirokuro@gmail.com"
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Apply corrected Phase 4 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/Phase4LevelSceneIntegration.yml')
          source = workflow_path.read_text(encoding='utf-8')
          marker_start = "          @'\n"
          marker_end = "\n          '@ | python -"
          if marker_start not in source or marker_end not in source:
              raise RuntimeError('Phase4 integration script markers were not found.')

          script = source.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = textwrap.dedent(script)

          old_project = "    text = replace_once(text, '</Project>', project_items + '</Project>', 'vcxproj Phase4 ItemGroup')"
          new_project = "    project_end = text.rfind('</Project>')\n    if project_end < 0: raise RuntimeError('vcxproj Project end was not found')\n    text = text[:project_end] + project_items + text[project_end:]"
          old_filters = "    text = replace_once(text, '</Project>', filter_items + '</Project>', 'filters Phase4 ItemGroup')"
          new_filters = "    project_end = text.rfind('</Project>')\n    if project_end < 0: raise RuntimeError('filters Project end was not found')\n    text = text[:project_end] + filter_items + text[project_end:]"

          if script.count(old_project) != 1 or script.count(old_filters) != 1:
              raise RuntimeError('Corrected XML insertion targets were not found exactly once.')
          script = script.replace(old_project, new_project, 1)
          script = script.replace(old_filters, new_filters, 1)
          exec(compile(script, 'phase4_integration.py', 'exec'), {})
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add Project
          git commit -m "Level読込をTransactional Loaderへ統合"
          git push origin HEAD:feature/phase4-level-scene

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Compile Debug C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:ClCompile /p:Platform=x64 /p:Configuration=Debug /p:WarningLevel=Level4 /p:TreatWarningAsError=true /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Compile Release C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.sln /m /t:ClCompile /p:Platform=x64 /p:Configuration=Release /p:WarningLevel=Level4 /p:TreatWarningAsError=true /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Remove temporary workflows and push
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/Phase4LevelSceneIntegration.yml .github/workflows/Phase4LevelSceneIntegrationRetry.yml
          git commit -m "Phase 4の一時Level Scene検証Workflowを削除"
          git push origin HEAD:feature/phase4-level-scene
