name: Phase27ApplyPatch

on:
  push:
    branches:
      - feature/phase27-lod-bounds-budget-culling
    paths:
      - '.github/workflows/Phase27ApplyPatch.yml'
      - '.github/scripts/phase27_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase27-lod-bounds-budget-culling
          fetch-depth: 0
      - name: Apply Phase27 project patch
        run: python .github/scripts/phase27_patch.py
      - name: Commit project changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project
          if git diff --cached --quiet; then
            echo "No Project changes to commit."
            exit 0
          fi
          git commit -m "Phase27: implement LOD bounds budget and culling"
          git push origin HEAD:feature/phase27-lod-bounds-budget-culling
