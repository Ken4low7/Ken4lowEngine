name: Phase25 Rename Payload Locals

on:
  push:
    branches:
      - feature/phase25-vfx-graph-editor-preview

permissions:
  contents: write

jobs:
  rename-payload-locals:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Give payload branches unique local names
        shell: python
        run: |
          from pathlib import Path

          path = Path("Project/Engine/Vfx/Graph/Editor/VfxGraphEditor.cpp")
          text = path.read_text(encoding="utf-8")
          names = {
              "VfxGraphSpawnRateNode": "spawnRate",
              "VfxGraphBurstNode": "burst",
              "VfxGraphSpawnSphereNode": "spawnSphere",
              "VfxGraphSpawnBoxNode": "spawnBox",
              "VfxGraphLifetimeNode": "lifetime",
              "VfxGraphInitialVelocityNode": "initialVelocity",
              "VfxGraphInitialColorNode": "initialColor",
              "VfxGraphInitialSizeNode": "initialSize",
              "VfxGraphGravityNode": "gravity",
              "VfxGraphDragNode": "drag",
              "VfxGraphInitialRotationNode": "initialRotation",
              "VfxGraphRotationRateNode": "rotationRate",
              "VfxGraphSizeOverLifeNode": "sizeOverLife",
              "VfxGraphColorOverLifeNode": "colorOverLife",
              "VfxGraphCollisionNode": "collision",
              "VfxGraphSubEmitterNode": "subEmitter",
              "VfxGraphSpriteRendererNode": "spriteRenderer",
              "VfxGraphRibbonRendererNode": "ribbonRenderer",
              "VfxGraphTrailRendererNode": "trailRenderer",
              "VfxGraphMeshRendererNode": "meshRenderer",
          }

          marker = "auto* p = std::get_if<"
          if text.count(marker) != len(names):
              raise RuntimeError(f"Expected {len(names)} payload pointer branches, found {text.count(marker)}")

          for type_name, local_name in names.items():
              needle = f"auto* p = std::get_if<{type_name}>(&node.payload)"
              if text.count(needle) != 1:
                  raise RuntimeError(f"Expected exactly one branch for {type_name}")

              condition_start = text.index(needle)
              replacement = f"auto* {local_name} = std::get_if<{type_name}>(&node.payload)"
              text = text[:condition_start] + replacement + text[condition_start + len(needle):]

              # Match the branch braces so only this payload's member accesses are renamed.
              open_brace = text.find("{", condition_start + len(replacement))
              if open_brace < 0:
                  raise RuntimeError(f"Missing branch body for {type_name}")
              depth = 0
              close_brace = -1
              for index in range(open_brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          close_brace = index
                          break
              if close_brace < 0:
                  raise RuntimeError(f"Unbalanced branch body for {type_name}")

              body = text[open_brace:close_brace + 1]
              if "p->" not in body:
                  raise RuntimeError(f"Expected payload member access in {type_name}")
              body = body.replace("p->", f"{local_name}->")
              text = text[:open_brace] + body + text[close_brace + 1:]

          if marker in text:
              raise RuntimeError("Generic payload pointer declarations remain after rename")

          path.write_text(text, encoding="utf-8")

      - name: Commit warning fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project/Engine/Vfx/Graph/Editor/VfxGraphEditor.cpp
          git commit -m "Phase25: give payload editor branches unique locals"
          git push
