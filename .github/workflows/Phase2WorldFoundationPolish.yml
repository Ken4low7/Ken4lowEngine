name: Phase2WorldFoundationPolish

on:
  push:
    branches:
      - feature/phase2-world-foundation

permissions:
  contents: write

jobs:
  polish:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase2-world-foundation
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "Ken4low7"
          git config user.email "knt411sirokuro@gmail.com"

      - name: Apply Phase 2 polish
        shell: pwsh
        run: |
          python Project/Tools/Scripts/PolishPhase2WorldFoundation.py apply
          python Project/Tools/Scripts/PolishPhase2WorldFoundation.py validate
          git add -A
          git commit -m "ActorHandleの無効化条件とWorld初期化責務を整理"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Compile Debug C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.vcxproj /m /t:ClCompile /p:Platform=x64 /p:Configuration=Debug /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Compile Release C++
        shell: pwsh
        run: msbuild Project/Ken4lowEngine.vcxproj /m /t:ClCompile /p:Platform=x64 /p:Configuration=Release /verbosity:minimal "/clp:ErrorsOnly;Summary"

      - name: Remove temporary polish files
        shell: pwsh
        run: |
          git rm .github/workflows/Phase2WorldFoundationPolish.yml
          git rm Project/Tools/Scripts/PolishPhase2WorldFoundation.py
          git commit -m "Phase 2の一時最終検証Workflowを削除"

      - name: Push final Phase 2 commits
        shell: pwsh
        run: git push origin HEAD:feature/phase2-world-foundation
