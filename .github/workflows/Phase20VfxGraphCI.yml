name: Phase20VfxGraphCI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase20-static-contracts:
    name: Phase20 VFX Graph Static Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate Engine Module Ownership
        run: python Tools/Scripts/ValidateEngineModules.py

      - name: Validate Project Assets
        run: python Tools/Scripts/ValidateProjectAssets.py

      - name: Check Broken References
        run: python Tools/Scripts/CheckBrokenReferences.py

      - name: Run Phase20 Static Contracts
        run: python Tests/Phase20/run_phase20_static_tests.py
