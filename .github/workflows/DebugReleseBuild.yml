name: TeamDevelopmentCI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-validation:
    name: Project Validation and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Show Python Version
        run: python --version

      - name: Validate Engine Module Ownership
        run: python Tools/Scripts/ValidateEngineModules.py

      - name: Validate Project Assets
        run: python Tools/Scripts/ValidateProjectAssets.py

      - name: Check Broken References
        run: python Tools/Scripts/CheckBrokenReferences.py

      - name: Run Automated Tests
        run: python -m unittest discover -s Tests/Phase5 -p "test_*.py" -v

  compile:
    name: Compile ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    needs: project-validation
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Compile C++
        shell: pwsh
        run: |
          msbuild Project/Ken4lowEngine.vcxproj /m /t:ClCompile /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} /verbosity:minimal "/clp:ErrorsOnly;Summary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain compile-only validation
        shell: pwsh
        run: |
          Write-Host "Phase 5 CI validates every C++ translation unit in ${{ matrix.configuration }}."
          Write-Host "The full Debug link is intentionally separate because the hosted runner does not provide the repository's assimp-vc143-mtd.lib binary."
