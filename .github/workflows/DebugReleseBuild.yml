name: TeamDevelopmentCI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-validation:
    name: Project Validation and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Show Python Version
        run: python --version

      - name: Validate Engine Module Ownership
        run: python Tools/Scripts/ValidateEngineModules.py

      - name: Validate Project Assets
        run: python Tools/Scripts/ValidateProjectAssets.py

      - name: Check Broken References
        run: python Tools/Scripts/CheckBrokenReferences.py

      - name: Run Automated Tests
        run: |
          python -m unittest discover -s Tests/Phase5 -p "test_*.py" -v
          python -m unittest discover -s Tests/Phase7 -p "test_*.py" -v # Frames in Flightの危険な単一Upload再導入をCIで防ぐ。
          python -m unittest discover -s Tests/Phase8 -p "test_*.py" -v # Content Pipelineの決定性・依存関係・DDC契約をCIで保証する。

  compile:
    name: Compile ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    needs: project-validation
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Validate Content Pipeline PowerShell
        shell: pwsh
        run: |
          $scripts = @(
            "Project/Tools/Scripts/BuildAssetCommon.ps1",
            "Project/Tools/Scripts/BuildTextures.ps1",
            "Project/Tools/Scripts/BuildMeshes.ps1",
            "Project/Tools/Scripts/BuildFonts.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $script, $_.Message) }
              exit 1
            }
          }

          . "Project/Tools/Scripts/BuildAssetCommon.ps1"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "Ken4lowDdcSmoke"
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $sourcePath = Join-Path $smokeRoot "source.bin"
          $outputPath = Join-Path $smokeRoot "restored.bin"
          Set-Content -LiteralPath $sourcePath -Value "Ken4low-DDC-Smoke" -NoNewline -Encoding UTF8
          $buildKey = Get-DerivedDataBuildKey -AssetType "Smoke" -BuildVersion 1 -Inputs @("Content=Ken4low-DDC-Smoke")
          $entry = Get-DdcEntryDirectory -GeneratedRoot $smokeRoot -AssetType "Smoke" -BuildKey $buildKey
          $cachePath = Join-Path $entry "payload.bin"
          [int64]$written = Store-DdcFile -SourcePath $sourcePath -CachePath $cachePath
          $restored = Restore-DdcFile -CachePath $cachePath -OutputPath $outputPath
          if (-not $restored.Hit -or $written -le 0 -or (Get-FileSha256 $sourcePath) -ne (Get-FileSha256 $outputPath)) {
            Write-Error "Derived Data Cache smoke test failed."
            exit 1
          }
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force

      - name: Compile C++
        shell: pwsh
        run: |
          msbuild Project/Ken4lowEngine.vcxproj /m /t:ClCompile /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} /verbosity:minimal "/clp:ErrorsOnly;Summary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain compile-only validation
        shell: pwsh
        run: |
          Write-Host "Phase 5/7/8 CI validates every C++ translation unit in ${{ matrix.configuration }}."
          Write-Host "The full Debug link is intentionally separate because the hosted runner does not provide the repository's assimp-vc143-mtd.lib binary."
