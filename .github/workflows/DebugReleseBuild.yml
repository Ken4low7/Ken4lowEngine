# ---------- Workflow名 ---------- #
name: BuildTests

# ---------- トリガー ---------- #
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

# ---------- 環境変数 ---------- #
env:
  # リポジトリのルートを基準にしたSolutionファイルのパス
  SOLUTION_FILE_PATH: Project/Ken4lowEngine.sln

# ---------- ジョブ ---------- #
jobs:
  build:
    name: Build ${{ matrix.configuration }}

    # Visual Studio 2026とv145 Toolsetが入った公開Repository用Runner
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Show MSBuild Version
        run: msbuild -version

      - name: Build ${{ matrix.configuration }}
        id: compile
        shell: pwsh
        run: |
          $logPath = "msbuild-${{ matrix.configuration }}.log"
          $diagnosticPath = "diagnostics-${{ matrix.configuration }}.txt"
          & msbuild "${{ env.SOLUTION_FILE_PATH }}" /m /t:Rebuild /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} /verbosity:minimal "/clp:ErrorsOnly;Summary" *> $logPath
          $buildExitCode = $LASTEXITCODE
          # Phase 7の検証中は失敗理由だけを別Artifactへ保存し、短い診断Jobから確認できるようにする。
          Get-Content $logPath | Where-Object { $_ -match 'error (C|LNK|MSB)[0-9]+|Build FAILED|[0-9]+ Error\(s\)' } | Set-Content $diagnosticPath
          "exit_code=$buildExitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-diagnostics-${{ matrix.configuration }}
          path: diagnostics-${{ matrix.configuration }}.txt
          retention-days: 1

      - name: Fail when build failed
        if: steps.compile.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

  diagnostics:
    name: Phase 7 Diagnostics
    if: always()
    needs: build
    runs-on: windows-2025-vs2026
    steps:
      - name: Download diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: phase7-diagnostics-*
          merge-multiple: true

      - name: Print diagnostics
        shell: pwsh
        run: |
          # Build Jobの長いログを再出力せず、抽出済みのコンパイルエラーだけを表示する。
          Get-ChildItem diagnostics-*.txt | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName
          }